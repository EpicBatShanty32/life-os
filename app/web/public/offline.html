<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Life OS — нет сети</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f6f7fb;
        color: #17181c;
      }
      main { max-width: 420px; text-align: center; }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(180deg, #a18bb7 0%, #8b74a3 100%);
        display: grid; place-items: center;
        color: #fff; font-size: 28px; font-weight: 700;
      }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 20px; color: #7a7d87; }
      button {
        min-height: 44px; padding: 0 20px;
        border: 0; border-radius: 999px;
        background: #a18bb7; color: #fff; font: inherit; font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">L</div>
      <h1>Нет связи с сервером</h1>
      <p>Life OS работает локально: проверьте, что запущен сервер приложения, и повторите.</p>
      <button type="button" onclick="location.reload()">Попробовать снова</button>
    </main>
  </body>
</html>
