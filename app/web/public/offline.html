<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F5F4F1" />
    <title>Life OS — нет сети</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        font:
          15px/1.55 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          'Helvetica Neue',
          sans-serif;
        background: #f5f4f1;
        color: #1b1a17;
      }
      main {
        max-width: 380px;
        text-align: left;
      }
      .mark {
        width: 44px;
        height: 44px;
        margin-bottom: 20px;
        object-fit: contain;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      p {
        margin: 0 0 20px;
        color: #6e6a63;
      }
      button {
        min-height: 36px;
        padding: 0 14px;
        border: 1px solid rgba(27, 26, 23, 0.18);
        border-radius: 8px;
        background: #ffffff;
        color: #1b1a17;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        border-color: rgba(27, 26, 23, 0.32);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #121211;
          color: #edebe5;
        }
        p {
          color: #a7a29a;
        }
        button {
          border-color: rgba(255, 255, 255, 0.17);
          background: #1a1a18;
          color: #edebe5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="./logo-256.png" width="44" height="44" alt="" aria-hidden="true" />
      <h1>Нет связи с сервером</h1>
      <p>Life OS работает локально: проверьте, что запущен сервер приложения, и повторите.</p>
      <button type="button" onclick="location.reload()">Попробовать снова</button>
    </main>
  </body>
</html>
