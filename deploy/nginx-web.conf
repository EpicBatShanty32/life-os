# ============================================================================
# nginx внутри lifeos-web: только статика SPA, TLS и прокси делает Caddy.
# Образ: nginxinc/nginx-unprivileged:1.27-alpine (uid 101, порт 8080).
# Файл копируется в /etc/nginx/conf.d/default.conf (см. deploy/Dockerfile.web).
#
# СТАТУС: не проверено — docker в среде нет.
# ============================================================================

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Не афишировать версию nginx.
    server_tokens off;

    # Сжатие делает Caddy (encode zstd gzip) — здесь выключено, чтобы
    # не жать дважды.
    gzip off;

    # Тело запроса: загрузки/видео идут через /api/* → Caddy → lifeos-api,
    # поэтому статике большое тело не нужно.
    client_max_body_size 1m;

    # --- SPA: любой неизвестный путь отдаёт оболочку ------------------------
    # Нужно для прямых ссылок и для «на экран Домой» на iPhone:
    # /journal, /body, /courses/3 должны открываться без 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- index.html и service-worker не кэшируем ----------------------------
    # Иначе после обновления iPhone держит старую оболочку и старый SW
    # (PWA в standalone-режиме особенно упряма — см. DEPLOY_GUIDE §3).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # --- Ассеты Vite: в именах хэш, можно кэшировать навсегда ---------------
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Иконки/шрифты/картинки PWA
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # --- Служебное -----------------------------------------------------------
    # /api/* и /ws сюда попадать не должны: Caddy маршрутизирует их напрямую
    # в lifeos-api. Если запрос всё-таки пришёл — честный 404, а не SPA-оболочка.
    location /api/ {
        return 404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Скрыть .git/.env, если что-то случайно попадёт в dist.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
